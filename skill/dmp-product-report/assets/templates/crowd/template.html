<main class="page"><header class="top"><div><div class="eyebrow">人群对比 · 分类构成与效率</div><h1>__TITLE__</h1><div class="subject">__SUBJECT__</div></div><div class="asof">四周期对比 + 8个自然周</div></header><section class="board"><div class="tabs" role="tablist" aria-label="选择指标">__TABS__</div><div class="panel" role="tabpanel" id="metric-panel" tabindex="0"><div class="controls"><div class="switch"><button type="button" data-mode="comparison" aria-pressed="true">7天 / 30天对比</button><button type="button" data-mode="trend" aria-pressed="false">自然周对比</button></div></div><div class="chart-head"><h2><span id="metric-title"></span><span class="unit" id="metric-unit"></span></h2></div><p class="note" id="chart-method"></p><div class="legend-row" id="group-legend"></div><svg id="composition-chart" class="chart" role="img" aria-labelledby="chart-title chart-desc"></svg><p class="chart-hint">点击柱状图或周期卡片，查看该周期全部分类的数值与占比。</p><section class="detail" aria-live="polite"><h3 id="detail-title"></h3><table><thead id="detail-head"></thead><tbody id="detail-body"></tbody></table><p class="reconcile" id="reconcile"></p></section><p class="definition" id="definition"></p><p class="note">__NOTE__</p></div></section><footer class="footnote"><p>__FOOT__</p><p>__SOURCE__</p></footer></main><script id="dashboard-data" type="application/json">__DATA__</script><script>
(()=>{'use strict';const model=JSON.parse(document.getElementById('dashboard-data').textContent),svg=document.getElementById('composition-chart'),tabs=[...document.querySelectorAll('[data-metric]')],colors=['#315bd6','#67b4aa','#e8ab58','#9b87cf','#7eacc7','#ce8f9b'],ns='http://www.w3.org/2000/svg';let metric=model.metrics[0],mode='comparison',selected=model.periods.find(p=>p.mode==='comparison');const value=(p,id)=>p.values[metric.id][id],fmt=v=>v.kind==='missing'?'未返回':metric.format==='percent'?Number((v.value*100).toFixed(2))+'%':Number(v.value.toFixed(2)).toLocaleString('zh-CN'),sum=p=>model.groups.reduce((n,g)=>n+(value(p,g.id).kind==='exact'?value(p,g.id).value:0),0),known=p=>model.groups.filter(g=>value(p,g.id).kind==='exact');

function details(p){selected=p;document.getElementById('detail-title').textContent=p.label+' · '+p.start+' 至 '+p.end;const head=document.getElementById('detail-head'),body=document.getElementById('detail-body');head.replaceChildren();body.replaceChildren();const tr=document.createElement('tr');for(const t of ['人群分类',metric.label,metric.chart==='composition'?'已返回分类占比':'']){const th=document.createElement('th');th.textContent=t;tr.append(th);}head.append(tr);const total=sum(p);model.groups.forEach((g,i)=>{const v=value(p,g.id),tr=document.createElement('tr');tr.dataset.group=g.id;const name=document.createElement('td'),dot=document.createElement('i');dot.className='dot-inline';dot.style.background=colors[i];name.append(dot,document.createTextNode(g.label));const num=document.createElement('td');num.textContent=fmt(v);const share=document.createElement('td');share.textContent=metric.chart!=='composition'?'':v.kind==='missing'?'未返回':total===0?'—':(v.value/total*100).toFixed(1)+'%';tr.append(name,num,share);body.append(tr);});const platform=value(p,'total'),missing=model.groups.length-known(p).length;document.getElementById('reconcile').textContent=metric.chart==='composition'?'平台合计：'+fmt(platform)+'；已返回分类之和：'+(known(p).length?total:'未返回')+'。'+(platform.kind==='exact'&&total!==platform.value?'分类之和与平台合计不一致，占比仅描述已返回分类。':'')+(missing?' '+missing+'类未返回，缺失不表示为0。':'全部分类均有数值。'):'平台合计率：'+fmt(platform)+'。各分类比例独立比较，不能相加为100%。';svg.querySelectorAll('[data-period]').forEach(n=>n.querySelector('.cell-frame')?.setAttribute('stroke',n.dataset.period===p.id?'#9ab2ee':'#e5eaf1'));}
function draw(){const ps=model.periods.filter(p=>p.mode===mode),w=Math.max(290,svg.getBoundingClientRect().width),mobile=w<650,cols=metric.chart==='composition'?(w<600?1:w<1000?2:4):(mobile?2:4),cw=w/cols,ch=metric.chart==='composition'?320:(mobile?224:250),rows=Math.ceil(ps.length/cols),h=rows*ch;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.style.height=h+'px';svg.replaceChildren(el('title',{id:'chart-title'},metric.label+(metric.chart==='composition'?'分类构成':'分类效率比较')),el('desc',{id:'chart-desc'},ps.map(p=>p.label+' '+model.groups.map(g=>g.label+' '+fmt(value(p,g.id))).join('，')).join('；')));const max=Math.max(0,...ps.flatMap(p=>model.groups.map(g=>value(p,g.id)).filter(v=>v.kind==='exact').map(v=>v.value)))||1;
const peak=Math.max(0,...ps.flatMap(p=>model.groups.map(g=>{const v=value(p,g.id),total=sum(p);return v.kind==='exact'&&total>0?v.value/total*100:0;})));
const target=peak*1.12/4,magnitude=10**Math.floor(Math.log10(target||1)),step=[1,1.25,1.5,2,2.5,3,4,5,7.5,10].map(n=>n*magnitude).find(n=>n>=target)||10*magnitude,axisMax=peak?Math.min(100,step*4):100;
if(metric.chart==='composition')svg.setAttribute('data-axis-max',axisMax);else svg.removeAttribute('data-axis-max');
ps.forEach((p,index)=>{const ox=index%cols*cw,oy=Math.floor(index/cols)*ch,card=el('g',{tabindex:'0',role:'button','data-period':p.id,'aria-label':p.label+' '+p.start+' 至 '+p.end});card.append(el('rect',{class:'cell-frame',x:ox+4,y:oy+4,width:cw-8,height:ch-8,rx:10,fill:'#fff',stroke:selected?.id===p.id?'#9ab2ee':'#e5eaf1'}));card.append(el('text',{x:ox+cw/2,y:oy+29,'text-anchor':'middle','font-size':mobile?13:15,'font-weight':600,fill:'#425c7a'},p.label));card.append(el('text',{x:ox+cw/2,y:oy+48,'text-anchor':'middle','font-size':mobile?10:12,fill:'#8191a5'},p.start.slice(5)+'—'+p.end.slice(5)));const total=sum(p),count=known(p).length;
if(metric.chart==='composition'){
 const left=ox+39,right=ox+cw-15,base=oy+216,top=oy+85,ph=base-top,slot=(right-left)/model.groups.length;
 card.append(el('text',{x:ox+cw/2,y:oy+66,'text-anchor':'middle','font-size':10,fill:'#8191a5'},'已返回合计：'+(count?total.toLocaleString('zh-CN'):'未返回')));
 for(let t=0;t<=4;t++){const v=axisMax*t/4,y=base-ph*t/4;card.append(el('line',{x1:left,x2:right,y1:y,y2:y,stroke:'#e7edf5'}),el('text',{x:left-5,y:y+3,'text-anchor':'end','font-size':9,fill:'#8b9bb1'},Number(v.toFixed(4))+'%'));}
 const labels={itemOld:['宝贝老客'],itemNewShopOld:['宝贝新客','且店铺老客'],shopNewCategoryOld:['店铺新客','且类目老客'],categoryNew:['类目新客']};
 model.groups.forEach((g,i)=>{
  const v=value(p,g.id),x=left+slot*(i+.5),fraction=v.kind==='exact'&&total>0?v.value/total:null;
  const bar=el('g',{'data-group':g.id,'data-value':v.kind==='exact'?v.value:'missing','data-share':fraction===null?'missing':fraction});
  if(fraction!==null){const height=fraction*100/axisMax*ph;bar.append(el('rect',{class:'bar',x:x-slot*.29,y:base-height,width:slot*.58,height,rx:3,fill:colors[i],'data-count-bar':g.id}));bar.append(el('text',{x,y:base-height-6,'text-anchor':'middle','font-size':9,'font-weight':600,fill:'#46658b'},(fraction*100).toFixed(1)+'%'));}
  else bar.append(el('text',{x,y:base-8,'text-anchor':'middle','font-size':9,fill:'#9ba6b6'},v.kind==='missing'?'未返回':'—'));
  const lines=labels[g.id]||[g.label];lines.forEach((text,j)=>bar.append(el('text',{x,y:oy+238+j*13,'text-anchor':'middle','font-size':9,fill:'#647d9e'},text)));
  bar.append(el('text',{x,y:oy+274,'text-anchor':'middle','font-size':10,fill:'#8191a5'},fmt(v)));bar.append(el('title',{},g.label+' '+fmt(v)+(fraction===null?'':' · '+(fraction*100).toFixed(2)+'%')));card.append(bar);
 });
 card.append(el('text',{x:ox+cw/2,y:oy+ch-19,'text-anchor':'middle','font-size':10,fill:'#8191a5'},count===model.groups.length?'分类完整':count+'类有值 · '+(model.groups.length-count)+'类未返回'));
}
else{const left=ox+14,right=ox+cw-14,bw=right-left;model.groups.forEach((g,i)=>{const v=value(p,g.id),y=oy+80+i*(mobile?31:36);card.append(el('circle',{cx:left+3,cy:y-3,r:4,fill:colors[i]}));if(v.kind==='exact'){const length=v.value/max*(bw-62);card.append(el('rect',{x:left+15,y:y-10,width:Math.max(1,length),height:13,rx:3,fill:colors[i],'data-rate':g.id,'data-value':v.value}));card.append(el('text',{x:right,y:y,'text-anchor':'end','font-size':mobile?10:12,fill:'#526b86'},fmt(v)));}else card.append(el('text',{x:right,y:y,'text-anchor':'end','font-size':11,fill:'#9ba6b6'},'未返回'));});}
card.addEventListener('click',()=>details(p));card.addEventListener('focus',()=>details(p));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();details(p);}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const i=Math.max(0,Math.min(ps.length-1,index+(e.key==='ArrowRight'?1:-1)));svg.querySelectorAll('[data-period]')[i]?.focus();}});svg.append(card);});details(selected&&ps.some(p=>p.id===selected.id)?selected:ps[0]);}
function show(){tabs.forEach(b=>{const on=b.dataset.metric===metric.id;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;});document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));document.getElementById('metric-panel').setAttribute('aria-labelledby','tab-'+metric.id);document.getElementById('metric-title').textContent=metric.label+(metric.chart==='composition'?' · 人群构成':' · 分类比较');document.getElementById('metric-unit').textContent=metric.chart==='composition'?'占比：% · 原始单位：'+metric.unit:'单位：'+metric.unit;document.getElementById('chart-method').textContent=metric.chart==='composition'?'各周期并排展示四类人群占比，刻度随当前数据自适应且同组周期共用。柱顶为占比，下方为原始数值；分母为本周期已返回分类之和，平台合计单独核对，缺失保留未知。':'同一周期内并排比较各分类的原始比例，各周期共用刻度。颜色对应同一类人群；比例独立比较。';document.getElementById('definition').textContent=metric.definition;draw();}
const legend=document.getElementById('group-legend');model.groups.forEach((g,i)=>{const span=document.createElement('span'),dot=document.createElement('i');dot.style.background=colors[i];span.append(dot,document.createTextNode(g.label));legend.append(span);});tabs.forEach((b,i)=>{b.onclick=()=>{metric=model.metrics[i];show();};b.onkeydown=e=>{let j;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i+tabs.length-1)%tabs.length;if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;if(j!==undefined){e.preventDefault();metric=model.metrics[j];show();tabs[j].focus();}};});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;const ps=model.periods.filter(p=>p.mode===mode);selected=mode==='trend'?ps.at(-1):ps[0];show();});new ResizeObserver(draw).observe(svg);show();window.commerceUI={contract:model.contract};})();
