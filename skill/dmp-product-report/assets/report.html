(()=>{'use strict';const menuToggle=document.querySelector('.mobile-menu-toggle'),sidebar=document.querySelector('#report-sidebar'),backdrop=document.querySelector('.menu-backdrop'),mobile=matchMedia('(max-width:700px)');function setMenu(open){open=mobile.matches&&open;document.body.classList.toggle('menu-open',open);menuToggle?.setAttribute('aria-expanded',String(open));sidebar.inert=mobile.matches&&!open;sidebar.setAttribute('aria-hidden',String(mobile.matches&&!open));backdrop.hidden=!open;}menuToggle?.addEventListener('click',()=>setMenu(!document.body.classList.contains('menu-open')));backdrop?.addEventListener('click',()=>setMenu(false));mobile.addEventListener('change',()=>setMenu(false));document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});setMenu(false);const buttons=[...document.querySelectorAll('[data-route]')],views=[...document.querySelectorAll('[data-view]')];function fit(frame){try{if(!frame.getBoundingClientRect().width)return;const page=frame.contentDocument?.querySelector('.page');if(page){const h=Math.ceil(Math.max(page.getBoundingClientRect().height,page.scrollHeight))+16;if(h>16&&Math.abs(parseInt(frame.style.height||'0')-h)>1)frame.style.height=h+'px';}}catch(e){}}
for(const frame of document.querySelectorAll('iframe'))frame.addEventListener('load',()=>{fit(frame);try{const page=frame.contentDocument.querySelector('.page');new ResizeObserver(()=>fit(frame)).observe(page);frame.contentDocument.fonts?.ready.then(()=>fit(frame));frame.contentWindow.addEventListener('resize',()=>fit(frame));}catch(e){}});
document.querySelectorAll('.module-detail').forEach(el=>el.addEventListener('toggle',()=>requestAnimationFrame(()=>el.querySelectorAll('iframe').forEach(fit))));

function show(id,focus=false){if(!views.some(v=>v.dataset.view===id))id='overview';views.forEach(v=>{v.hidden=v.dataset.view!==id;});buttons.forEach(b=>{const on=b.dataset.route===id;if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');b.tabIndex=0;if(on&&focus)b.focus();});requestAnimationFrame(()=>document.querySelectorAll('iframe').forEach(fit));history.replaceState(null,'','#'+id);}
buttons.forEach((b,i)=>{b.onclick=e=>{e.preventDefault();show(b.dataset.route);setMenu(false);};b.onkeydown=e=>{let j;if(e.key==='Home')j=0;if(e.key==='End')j=buttons.length-1;if(e.key==='ArrowDown')j=(i+1)%buttons.length;if(e.key==='ArrowUp')j=(i+buttons.length-1)%buttons.length;if(j!==undefined){e.preventDefault();show(buttons[j].dataset.route,true);}};});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));window.addEventListener('hashchange',()=>show(location.hash.slice(1)));window.addEventListener('beforeprint',()=>{document.querySelectorAll('iframe').forEach(fit);});show(location.hash.slice(1));})();

(()=>{const card=document.querySelector('.product-card');if(!card)return;const hero=card.querySelector('.product-hero');for(const button of card.querySelectorAll('.product-thumbnail[aria-pressed]'))button.addEventListener('click',()=>{const image=button.querySelector('img');if(!hero||!image)return;hero.src=image.src;hero.alt=image.alt;for(const peer of card.querySelectorAll('.product-thumbnail[aria-pressed]'))peer.setAttribute('aria-pressed',String(peer===button));});})();
